name: Build APK + IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

      - name: Configure Gradle timeouts
        run: |
          cd android
          echo "org.gradle.internal.http.connectionTimeout=120000" >> gradle.properties
          echo "org.gradle.internal.http.socketTimeout=120000" >> gradle.properties
          echo "org.gradle.internal.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "org.gradle.internal.http.socketTimeout=120000" >> ~/.gradle/gradle.properties

      - name: Build Release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-file: android/app/build.gradle
          arguments: assembleRelease
          gradle-version: '8.5'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install CocoaPods
        run: cd ios/App && pod install --repo-update

      - name: Build & Archive
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${APPLE_DEVELOPER_TEAM_ID} \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}" \
            archive

      - name: Export IPA
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportPath . \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${APPLE_DEVELOPER_TEAM_ID} \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app.ipa
          path: ios/App/*.ipa
          retention-days: 30

  release:
    name: Create Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release.apk
          path: ./release

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: app.ipa
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/app-release.apk
            release/app.ipa
          generate_release_notes: true
