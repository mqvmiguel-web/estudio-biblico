name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
      android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          cd android
          echo "org.gradle.internal.http.connectionTimeout=120000" >> gradle.properties
          echo "org.gradle.internal.http.socketTimeout=120000" >> gradle.properties
          echo "org.gradle.internal.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "org.gradle.internal.http.socketTimeout=120000" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          arguments: assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/*.apk
